<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="blog-post-card">
      <img 
        class="post-img" 
        src="https://images.pexels.com/photos/2881229/pexels-photo-2881229.jpeg" 
        alt="A bundle of aqua fiber optic cables plugged into a network server switch."
      />
      <div class="post-content">
        <h2 class="post-title">Learn Modern Networking</h2>
        <p class="post-excerpt">
            Master the technologies shaping tomorrow's connected systems. Explore what's new in cloud infrastructure, automated network ops, and cybersecurity.
        </p>
        <a class="read-more" href="#">Read More</a>
      </div>
    </div>
  </body>

</html>
