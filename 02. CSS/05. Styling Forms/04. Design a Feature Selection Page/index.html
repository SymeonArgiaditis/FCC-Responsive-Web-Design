<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="./styles.css">
  </head>

  <body>
    <h1>Feature Selection</h1>
    
    <div class="feature-card-container">
      <label class="feature-card">
        <input type="checkbox">
        <span class="card-title">Cloud Storage</span>
        <p>100 Gigabyte secure storage</p>
      </label>
      
      <label class="feature-card">
        <input type="checkbox">
        <span class="card-title">Dedicated Support</span>
        <p>24/7 customer help</p>
      </label>

      <label class="feature-card">
        <input type="checkbox">
        <span class="card-title">Advanced Analytics</span>
        <p>Insights & reports</p>
      </label>

      <label class="feature-card">
        <input type="checkbox">
        <span class="card-title">Custom User Themes</span>
        <p>Personalized dashboard design</p>
      </label>

      <label class="feature-card">
        <input type="checkbox">
        <span class="card-title">Multi-User Collab</span>
        <p>Team access and sharing</p>
      </label>

      <label class="feature-card">
        <input type="checkbox">
        <span class="card-title">API Access</span>
        <p>Integrate with your custom built tools</p>
      </label>
    </div>
  </body>

</html>
