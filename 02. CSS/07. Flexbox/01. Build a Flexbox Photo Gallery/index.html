<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="header">
      <h1>css flexbox photo gallery</h1>
    </header>
    <div class="gallery">
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/1.jpg" 
        alt="A grey-and-white cat sniffing a blade of grass outdoors in a garden."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/2.jpg" 
        alt="A grey Bengal-patterned cat mid-stretch on a wooden floor, back arched with tail curled up."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/3.jpg" 
        alt="A brown tabby cat sitting upright and alert on a wooden shelf against a white wall."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/4.jpg" 
        alt="A brown tabby cat scrunching its face while being scratched under the chin by a person's finger, on a stone surface."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/5.jpg" 
        alt="A black cat with yellow eyes peeking out from inside a white laundry basket lined with floral fabric."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/6.jpg" 
        alt="A white cat with a grey patch on its head sitting outdoors on a stone wall, with a stone structure in the background."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/7.jpg" 
        alt="A fluffy white cat with amber eyes lying on a woven cushion, looking directly at the camera from a low angle."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/8.jpg" 
        alt="A cat with a grey-and-white face and striking blue-green eyes peeking through a cat flap in a door."
      />
      <img 
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/9.jpg" 
        alt="Close-up of a grey-and-white cat's face, resting near the edge of a cardboard box, looking downward."
      />
    </div>
  </body>
</html>
