<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Inventory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <h1>Book Inventory</h1>

    <table>
      <caption></caption>

      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>

      <tbody>
        <tr class="read">
          <td>Man and his Symbols</td>
          <td>Carl Jung</td>
          <td>Psychoanalysis</td>
          <td><span class="status">Read</span></td>
          <td>
            <span class="rate three">
              <span></span><span></span><span></span>
            </span>
          </td>
        </tr>

        <tr class="to-read">
          <td>Dark Matter</td>
          <td>Blake Crouch</td>
          <td> Science fiction, Thriller</td>
          <td><span class="status">To Read</span></td>
          <td>
            <span class="rate">
              <span></span><span></span><span></span>
            </span>
          </td>
        </tr>

        <tr class="read">
          <td>Red Rising</td>
          <td>Pierce Brown</td>
          <td> Science fiction</td>
          <td><span class="status">Read</span></td>
          <td>
            <span class="rate two">
              <span></span><span></span><span></span>
            </span>
          </td>
        </tr>

        <tr class="in-progress">
          <td>House of Leaves</td>
          <td> Mark Z. Danielewski</td>
          <td>Horror</td>
          <td><span class="status">In Progress</span></td>
          <td>
            <span class="rate">
              <span></span><span></span><span></span>
            </span>
          </td>
        </tr>

      </tbody>
    </table>
  
  </body>
</html>
